[project]
name = "bharat-id-validator"
version = "1.0.0"
description = "Bharat ID Validator - Educational Document Validation Service"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
